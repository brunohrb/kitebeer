<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#030d16">
<title>Gastos · Kite Beer 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#030d16;--surface:#061825;--card:#0a2236;--teal:#00d4b8;--cyan:#3de8ff;--gold:#f5c518;--green:#4ade80;--danger:#ff4f4f;--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.48);--faint:rgba(255,255,255,.06);--border:rgba(255,255,255,.09);}
html{scroll-behavior:smooth;background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;padding-bottom:60px;}
.hdr{position:sticky;top:0;z-index:100;padding:max(env(safe-area-inset-top),12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;background:rgba(3,13,22,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.hdr-name{font-size:.92em;font-weight:800;background:linear-gradient(90deg,var(--teal),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hdr-sub{font-size:.62em;color:var(--muted);margin-top:1px;}
.hdr-back{font-size:.75em;color:var(--muted);text-decoration:none;padding:6px 12px;border:1px solid var(--border);border-radius:20px;}
#overlay{display:none;position:fixed;inset:0;background:rgba(3,13,22,.88);z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#overlay.on{display:flex;}
.spin{width:42px;height:42px;border:3px solid rgba(0,212,184,.2);border-top:3px solid var(--teal);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
#overlay-msg{font-size:.82em;color:var(--muted);}
.wrap{max-width:500px;margin:0 auto;padding:18px 16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:14px;}
.card-title{font-size:.75em;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--teal);margin-bottom:14px;}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.scard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;}
.scard-lbl{font-size:.6em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.scard-val{font-size:1.35em;font-weight:900;font-variant-numeric:tabular-nums;}
.scard-val.gold{color:var(--gold);}
.scard-val.teal{color:var(--teal);}
.pay-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.pay-names{display:flex;align-items:center;gap:8px;font-size:.86em;}
.pay-from{color:var(--danger);font-weight:700;}
.pay-arr{color:var(--muted);font-size:.8em;}
.pay-to{color:var(--green);font-weight:700;}
.pay-val{font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;white-space:nowrap;}
.bal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.bal-row:last-child{border:none;}
.bal-name{font-size:.86em;font-weight:600;}
.bal-val{font-size:.86em;font-weight:800;font-variant-numeric:tabular-nums;}
.bal-val.pos{color:var(--green);}
.bal-val.neg{color:var(--danger);}
.fg{margin-bottom:12px;}
label.lbl{display:block;font-size:.7em;font-weight:700;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
input,select{width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:.92em;font-family:inherit;-webkit-appearance:none;}
input:focus,select:focus{outline:none;border-color:var(--teal);background:rgba(0,212,184,.05);}
input::placeholder{color:var(--muted);}
select option{background:#0a2236;}
.btn{width:100%;padding:14px;border:none;border-radius:50px;background:linear-gradient(135deg,var(--teal),var(--cyan));color:#030d16;font-weight:800;font-size:.92em;cursor:pointer;font-family:inherit;transition:all .2s;}
.btn:hover{filter:brightness(1.08);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn.danger{background:rgba(255,79,79,.12);border:1px solid rgba(255,79,79,.3);color:var(--danger);}
.btn.sm{width:auto;padding:10px 18px;border-radius:30px;font-size:.8em;}
.btn-row{display:flex;gap:10px;align-items:center;}
.ptags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.ptag{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:30px;padding:7px 14px;font-size:.8em;font-weight:600;}
.pdel{background:none;border:none;color:rgba(255,79,79,.55);cursor:pointer;font-size:1em;padding:0;line-height:1;width:auto;}
.pdel:hover{color:var(--danger);}
.cbgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.cbopt input{display:none;}
.cbopt label{display:block;padding:8px 15px;border-radius:30px;border:1.5px solid var(--border);color:var(--muted);font-size:.8em;font-weight:700;cursor:pointer;transition:all .18s;}
.cbopt input:checked + label{background:rgba(0,212,184,.15);border-color:var(--teal);color:var(--teal);}
.exp-item{display:flex;justify-content:space-between;align-items:flex-start;padding:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;gap:10px;}
.exp-info strong{font-size:.88em;font-weight:700;display:block;}
.exp-info small{font-size:.7em;color:var(--muted);margin-top:2px;display:block;}
.exp-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.exp-val{font-weight:800;font-size:.9em;color:var(--teal);font-variant-numeric:tabular-nums;}
.exp-del{background:none;border:none;color:rgba(255,255,255,.22);font-size:1em;cursor:pointer;padding:4px;line-height:1;width:auto;}
.exp-del:hover{color:var(--danger);}
.empty{text-align:center;padding:22px;color:var(--muted);font-size:.82em;}
</style>
</head>
<body>

<div id="overlay"><div class="spin"></div><p id="overlay-msg">Conectando...</p></div>

<header class="hdr">
  <div>
    <div class="hdr-name">&#x1F4B8; Gastos &middot; Kite Beer</div>
    <div class="hdr-sub">Divis&atilde;o de despesas 2026</div>
  </div>
  <a href="velejin.html" class="hdr-back">&larr; Roteiro</a>
</header>

<div class="wrap">
  <div class="sum-grid">
    <div class="scard"><div class="scard-lbl">Total gasto</div><div class="scard-val gold" id="total-val">R$ 0,00</div></div>
    <div class="scard"><div class="scard-lbl">Despesas</div><div class="scard-val teal" id="total-count">0</div></div>
  </div>

  <div class="card">
    <div class="card-title">&#x2705; Como acertar</div>
    <div id="payment-plan"><div class="empty">Lance os gastos para ver o plano.</div></div>
  </div>

  <div class="card">
    <div class="card-title">&#x1F4CA; Saldo por pessoa</div>
    <div id="balance-list"><div class="empty">Sem dados ainda.</div></div>
  </div>

  <div class="card">
    <div class="card-title">&#x1F465; Galera da trip</div>
    <div class="btn-row">
      <input id="new-person" type="text" placeholder="Nome do participante" style="flex:1">
      <button class="btn sm" id="btn-add-person" onclick="addPerson()">+</button>
    </div>
    <div id="ptags" class="ptags"></div>
  </div>

  <div class="card">
    <div class="card-title">&#x1F4B8; Lan&ccedil;ar gasto</div>
    <div class="fg"><input id="desc-input" type="text" placeholder="Descri&ccedil;&atilde;o (ex: Uber, Cerveja, Pousada)"></div>
    <div class="fg"><input id="amount-input" type="number" placeholder="Valor (R$)" step="0.01" min="0" inputmode="decimal"></div>
    <div class="fg">
      <label class="lbl">Quem pagou?</label>
      <select id="payer-select"><option value="" disabled selected>Selecione...</option></select>
    </div>
    <div class="fg">
      <label class="lbl" style="color:var(--teal)">Para quem foi? (marque os envolvidos)</label>
      <div id="cbox-container" class="cbgrid"></div>
    </div>
    <button class="btn" id="btn-add-exp" onclick="addExpense()">SALVAR GASTO</button>
  </div>

  <div class="card">
    <div class="card-title">&#x1F4DC; Hist&oacute;rico</div>
    <div id="expenses-list"><div class="empty">Nenhuma despesa ainda.</div></div>
    <div style="margin-top:12px;"><button class="btn danger" onclick="limpar()">Limpar todas as despesas</button></div>
  </div>
</div>

<script>
(function(){
'use strict';
var SUPA_URL='https://fwhsjzkmnfxnlrvspkyr.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3aHNqemttbmZ4bmxydnNwa3lyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0Nzg3MzUsImV4cCI6MjA4MzA1NDczNX0.lT_tHpkxiOQl2HdsFc5VQr_xfkEvoGi101MaITnSLkc';
var CODIGO='KITEBEER26';
var SENHA='kite2026';
var sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
var grupoId=null,people=[],expenses=[];

function load(m){document.getElementById('overlay-msg').textContent=m||'Carregando...';document.getElementById('overlay').classList.add('on');}
function unload(){document.getElementById('overlay').classList.remove('on');}

window.addEventListener('load',async function(){
  load('Conectando...');
  try{
    var r=await sb.from('grupos').select('id').eq('codigo_acesso',CODIGO).eq('ativo',true).single();
    if(r.error||!r.data){
      var cr=await sb.from('grupos').insert([{nome:'Kite Beer 2026',senha:SENHA,codigo_acesso:CODIGO,criado_por:'App'}]).select().single();
      if(cr.error)throw cr.error;
      r.data=cr.data;
    }
    grupoId=r.data.id;
    await Promise.all([loadPeople(),loadExpenses()]);
  }catch(e){alert('Erro ao conectar: '+e.message);}
  finally{unload();}
});

async function loadPeople(){
  var r=await sb.from('participantes').select('nome').eq('grupo_id',grupoId).order('nome');
  if(r.error)throw r.error;
  people=r.data?r.data.map(function(p){return p.nome;}):[]; renderUI();
}
async function loadExpenses(){
  var r=await sb.from('despesas').select('id,descricao,valor,pagador,criado_em,despesas_envolvidos(participante_nome)').eq('grupo_id',grupoId).order('criado_em',{ascending:false});
  if(r.error)throw r.error;
  expenses=r.data?r.data.map(function(d){return{id:d.id,desc:d.descricao,amount:parseFloat(d.valor),payer:d.pagador,involved:d.despesas_envolvidos.map(function(e){return e.participante_nome;})};}):[]; renderUI();
}

window.addPerson=async function(){
  var name=document.getElementById('new-person').value.trim();
  if(!name){alert('Digite um nome!');return;}
  if(people.indexOf(name)>=0){alert('Nome ja existe!');return;}
  var btn=document.getElementById('btn-add-person');btn.disabled=true;
  try{
    var r=await sb.from('participantes').insert([{grupo_id:grupoId,nome:name}]);
    if(r.error)throw r.error;
    people.push(name);document.getElementById('new-person').value='';renderUI();
  }catch(e){alert('Erro: '+e.message);}finally{btn.disabled=false;}
};

window.deletePerson=async function(nome){
  if(expenses.some(function(e){return e.payer===nome||e.involved.indexOf(nome)>=0;})){alert(nome+' tem despesas lancadas.\nRemova primeiro.');return;}
  if(!confirm('Remover '+nome+'?'))return;
  load('Removendo...');
  try{
    var r=await sb.from('participantes').delete().eq('grupo_id',grupoId).eq('nome',nome);
    if(r.error)throw r.error;
    people=people.filter(function(p){return p!==nome;});renderUI();
  }catch(e){alert('Erro: '+e.message);}finally{unload();}
};

window.addExpense=async function(){
  var desc=document.getElementById('desc-input').value.trim();
  var amount=parseFloat(document.getElementById('amount-input').value);
  var payer=document.getElementById('payer-select').value;
  var involved=Array.from(document.querySelectorAll('.kb-cb:checked')).map(function(c){return c.value;});
  if(!desc||isNaN(amount)||amount<=0||!payer||!involved.length){alert('Preencha todos os campos!');return;}
  var btn=document.getElementById('btn-add-exp');btn.disabled=true;btn.textContent='Salvando...';
  load('Salvando...');
  try{
    var fe=await sb.rpc('adicionar_despesa_completa',{p_grupo_id:grupoId,p_descricao:desc,p_valor:amount,p_pagador:payer,p_envolvidos:involved});
    if(fe.error&&fe.error.code==='42883'){
      var d2=await sb.from('despesas').insert([{grupo_id:grupoId,descricao:desc,valor:amount,pagador:payer}]).select().single();
      if(d2.error)throw d2.error;
      var e3=await sb.from('despesas_envolvidos').insert(involved.map(function(n){return{despesa_id:d2.data.id,participante_nome:n};}));
      if(e3.error)throw e3.error;
    }else if(fe.error)throw fe.error;
    document.getElementById('desc-input').value='';document.getElementById('amount-input').value='';
    await loadExpenses();
  }catch(e){alert('Erro: '+e.message);}finally{unload();btn.disabled=false;btn.textContent='SALVAR GASTO';}
};

window.removeExpense=async function(id){
  if(!confirm('Apagar esta despesa?'))return;
  load('Removendo...');
  try{var r=await sb.from('despesas').delete().eq('id',id);if(r.error)throw r.error;await loadExpenses();}
  catch(e){alert('Erro: '+e.message);}finally{unload();}
};

window.limpar=async function(){
  if(!confirm('Limpar TODAS as despesas?'))return;
  load('Limpando...');
  try{var r=await sb.from('despesas').delete().eq('grupo_id',grupoId);if(r.error)throw r.error;expenses=[];renderUI();}
  catch(e){alert('Erro: '+e.message);}finally{unload();}
};

function renderUI(){renderPeople();renderExpenses();calcBalances();}

function renderPeople(){
  document.getElementById('ptags').innerHTML=people.map(function(p){
    return '<span class="ptag">'+p+'<button class="pdel" onclick="deletePerson(\''+p.replace(/'/g,"\\'")+'\')">&times;</button></span>';
  }).join('');
  var sel=document.getElementById('payer-select'),cur=sel.value;
  sel.innerHTML='<option value="" disabled selected>Selecione...</option>';
  people.forEach(function(p){var o=document.createElement('option');o.value=o.textContent=p;sel.appendChild(o);});
  if(people.indexOf(cur)>=0)sel.value=cur;
  var checked=Array.from(document.querySelectorAll('.kb-cb:checked')).map(function(c){return c.value;});
  document.getElementById('cbox-container').innerHTML=people.map(function(p){
    return '<div class="cbopt"><input type="checkbox" class="kb-cb" id="cb_'+p+'" value="'+p+'" '+(checked.indexOf(p)>=0||!checked.length?'checked':'')+'><label for="cb_'+p+'">'+p+'</label></div>';
  }).join('');
}

function renderExpenses(){
  var el=document.getElementById('expenses-list');
  if(!expenses.length){el.innerHTML='<div class="empty">Nenhuma despesa ainda.</div>';document.getElementById('total-val').textContent='R$ 0,00';document.getElementById('total-count').textContent='0';return;}
  var total=expenses.reduce(function(s,e){return s+e.amount;},0);
  document.getElementById('total-val').textContent='R$ '+total.toFixed(2);
  document.getElementById('total-count').textContent=expenses.length;
  el.innerHTML=expenses.map(function(e){
    return '<div class="exp-item"><div class="exp-info"><strong>'+e.desc+'</strong><small>'+e.payer+' pagou &middot; '+e.involved.join(', ')+'</small></div><div class="exp-right"><span class="exp-val">R$ '+e.amount.toFixed(2)+'</span><button class="exp-del" onclick="removeExpense(\''+e.id+'\')">&times;</button></div></div>';
  }).join('');
}

function calcBalances(){
  if(!people.length){
    document.getElementById('balance-list').innerHTML='<div class="empty">Adicione participantes.</div>';
    document.getElementById('payment-plan').innerHTML='<div class="empty">Lance os gastos para ver o plano.</div>';return;
  }
  var bal={};people.forEach(function(p){bal[p]=0;});
  expenses.forEach(function(e){
    var share=e.amount/e.involved.length;
    if(bal.hasOwnProperty(e.payer))bal[e.payer]+=e.amount;
    e.involved.forEach(function(p){if(bal.hasOwnProperty(p))bal[p]-=share;});
  });
  var rows=Object.entries(bal).filter(function(x){return Math.abs(x[1])>0.01;});
  document.getElementById('balance-list').innerHTML=!rows.length
    ?'<div class="empty" style="color:var(--teal)">&#x2705; Ninguem deve nada!</div>'
    :rows.map(function(x){return '<div class="bal-row"><span class="bal-name">'+x[0]+'</span><span class="bal-val '+(x[1]>0?'pos':'neg')+'">'+(x[1]>0?'recebe':'deve')+' R$ '+Math.abs(x[1]).toFixed(2)+'</span></div>';}).join('');
  var deb=Object.entries(bal).filter(function(x){return x[1]<-0.01;}).map(function(x){return{n:x[0],v:Math.abs(x[1])};}).sort(function(a,b){return b.v-a.v;});
  var cred=Object.entries(bal).filter(function(x){return x[1]>0.01;}).map(function(x){return{n:x[0],v:x[1]};}).sort(function(a,b){return b.v-a.v;});
  var planEl=document.getElementById('payment-plan');
  if(!deb.length){planEl.innerHTML='<div class="empty" style="color:var(--teal)">&#x2705; Tudo certo!</div>';return;}
  var html='',i=0,j=0;
  while(i<deb.length&&j<cred.length){
    var pay=Math.min(deb[i].v,cred[j].v);
    html+='<div class="pay-item"><div class="pay-names"><span class="pay-from">'+deb[i].n+'</span><span class="pay-arr">&rarr;</span><span class="pay-to">'+cred[j].n+'</span></div><span class="pay-val">R$ '+pay.toFixed(2)+'</span></div>';
    deb[i].v-=pay;cred[j].v-=pay;
    if(deb[i].v<0.01)i++;if(cred[j].v<0.01)j++;
  }
  planEl.innerHTML=html;
}
})();
</script>
</body>
</html>
